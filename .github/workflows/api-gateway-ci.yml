name: API Gateway CI

on:
  push:
    branches: [main]
    paths:
      - 'api-gateway/**'
  pull_request:
    branches: [main]
    paths:
      - 'api-gateway/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-gateway

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: mvn clean verify