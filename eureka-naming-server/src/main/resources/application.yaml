spring:
  application:
    name: eureka-naming-server
server:
  port: 8762 
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    peer-eureka-nodes:
      enabled: false
  management:
    endpoints:
      web:
        exposure:
          include: health
    endpoint:
      health:
        show-details: always